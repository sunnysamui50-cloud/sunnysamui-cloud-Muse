name: Deploy Muse to Cloud Run
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  REGION: europe-west2
  MUSE_SERVICE: muse-mcp
  BROWSER_SERVICE: muse-browser-worker
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Resolve verified commit
        id: revision
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build Muse container
        run: docker build --tag ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ steps.revision.outputs.sha }} .
      - name: Push Muse container
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ steps.revision.outputs.sha }}
      - name: Build browser worker container
        run: docker build --file Dockerfile.browser --tag ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ steps.revision.outputs.sha }} .
      - name: Push browser worker container
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ steps.revision.outputs.sha }}
      - name: Deploy browser worker
        id: browser
        run: |
          gcloud run deploy "${{ env.BROWSER_SERVICE }}" --image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ steps.revision.outputs.sha }}" --region "${{ env.REGION }}" --platform managed --ingress=all --default-url --no-allow-unauthenticated --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --min 0 --max 2 --cpu 1 --memory 1Gi --concurrency 1 --timeout 3600s --set-env-vars "BROWSER_WORKER_AUTH_MODE=iam"
          gcloud run services add-iam-policy-binding "${{ env.BROWSER_SERVICE }}" --region "${{ env.REGION }}" --member "serviceAccount:${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --role roles/run.invoker --quiet
      - name: Resolve browser worker URL
        id: browser-url
        run: |
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          BROWSER_URL="https://${{ env.BROWSER_SERVICE }}-${PROJECT_NUMBER}.${{ env.REGION }}.run.app"
          test -n "$BROWSER_URL"
          echo "url=$BROWSER_URL" >> "$GITHUB_OUTPUT"
          echo "Browser worker URL: $BROWSER_URL"
      - name: Verify browser worker health through Cloud Run IAM
        env:
          BROWSER_URL: ${{ steps.browser-url.outputs.url }}
        run: |
          echo "Verifying browser worker at $BROWSER_URL/healthz"
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --audiences="$BROWSER_URL")"
          set +e
          HTTP_CODE="$(curl --silent --show-error --dump-header /tmp/headers.txt --output /tmp/body.txt --write-out '%{http_code}' --header "Authorization: Bearer $TOKEN" "$BROWSER_URL/healthz")"
          CURL_EXIT=$?
          echo "HTTP status: $HTTP_CODE"
          echo "--- response headers ---"
          cat /tmp/headers.txt || true
          echo "--- response body ---"
          cat /tmp/body.txt || true
          echo "--- curl exit: $CURL_EXIT ---"
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
      - name: Deploy Muse MCP
        id: muse
        env:
          BROWSER_URL: ${{ steps.browser-url.outputs.url }}
        run: |
          ENV_MAP="APP_API_TIMEOUT_MS=10000,BROWSER_WORKER_URL=$BROWSER_URL,BROWSER_WORKER_AUTH_MODE=iam"
          SECRET_MAP="MCP_BEARER_TOKEN=MUSE_MCP_BEARER_TOKEN:latest"
          if [ -n "${{ vars.APP_API_BASE_URL }}" ]; then
            ENV_MAP="$ENV_MAP,APP_API_BASE_URL=${{ vars.APP_API_BASE_URL }}"
            SECRET_MAP="$SECRET_MAP,APP_API_TOKEN=MUSE_APP_API_TOKEN:latest"
          fi
          BASE_ARGS=(--image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ steps.revision.outputs.sha }}" --region "${{ env.REGION }}" --platform managed --allow-unauthenticated --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --min 0 --max 2 --cpu 1 --memory 512Mi --concurrency 40 --timeout 3600s --set-env-vars "$ENV_MAP" --set-secrets "$SECRET_MAP")
          gcloud run deploy "${{ env.MUSE_SERVICE }}" "${BASE_ARGS[@]}"
          echo "url=$(gcloud run services describe "${{ env.MUSE_SERVICE }}" --region "${{ env.REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Verify live MCP and real browser mission
        env:
          MCP_URL: ${{ steps.muse.outputs.url }}/mcp
          MCP_BEARER_TOKEN: ${{ secrets.MUSE_MCP_BEARER_TOKEN }}
        run: npm run verify:live
      - name: Show service URLs
        run: |
          echo "Muse MCP: ${{ steps.muse.outputs.url }}/mcp"
          echo "Browser worker: ${{ steps.browser-url.outputs.url }}"

# Diagnostic checkpoint: keep the response-body probe enabled until the 404 is classified.
