name: Deploy Muse to Cloud Run
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  REGION: europe-west2
  MUSE_SERVICE: muse-mcp
  BROWSER_SERVICE: muse-browser-worker
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build Muse container
        run: docker build --tag ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ github.sha }} .
      - name: Push Muse container
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ github.sha }}
      - name: Build browser worker container
        run: docker build --file Dockerfile.browser --tag ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ github.sha }} .
      - name: Push browser worker container
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ github.sha }}
      - name: Deploy browser worker
        id: browser
        run: |
          gcloud run deploy "${{ env.BROWSER_SERVICE }}" --image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-browser-worker:${{ github.sha }}" --region "${{ env.REGION }}" --platform managed --ingress=all --no-allow-unauthenticated --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --min 0 --max 2 --cpu 1 --memory 1Gi --concurrency 1 --timeout 3600s --set-env-vars "BROWSER_WORKER_AUTH_MODE=iam"
          gcloud run services add-iam-policy-binding "${{ env.BROWSER_SERVICE }}" --region "${{ env.REGION }}" --member "serviceAccount:${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --role roles/run.invoker --quiet
          echo "url=$(gcloud run services describe "${{ env.BROWSER_SERVICE }}" --region "${{ env.REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Verify browser worker health through Cloud Run IAM
        env:
          BROWSER_URL: ${{ steps.browser.outputs.url }}
        run: |
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --audiences="$BROWSER_URL")"
          curl --fail --silent --show-error --header "Authorization: Bearer $TOKEN" "$BROWSER_URL/healthz"
      - name: Deploy Muse MCP
        id: muse
        run: |
          BASE_ARGS=(--image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/muse/muse-mcp:${{ github.sha }}" --region "${{ env.REGION }}" --platform managed --allow-unauthenticated --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" --min 0 --max 2 --cpu 1 --memory 512Mi --concurrency 40 --timeout 3600s --set-env-vars "APP_API_BASE_URL=${{ vars.APP_API_BASE_URL }},APP_API_TIMEOUT_MS=10000,BROWSER_WORKER_URL=${{ steps.browser.outputs.url }},BROWSER_WORKER_AUTH_MODE=iam" --set-secrets "MCP_BEARER_TOKEN=MUSE_MCP_BEARER_TOKEN:latest")
          if [ -n "${{ vars.APP_API_BASE_URL }}" ]; then
            test -n "${{ secrets.MUSE_APP_API_TOKEN }}" || { echo "APP_API_BASE_URL is set but MUSE_APP_API_TOKEN is missing"; exit 1; }
            BASE_ARGS+=(--set-secrets "MCP_BEARER_TOKEN=MUSE_MCP_BEARER_TOKEN:latest,APP_API_TOKEN=MUSE_APP_API_TOKEN:latest")
          fi
          gcloud run deploy "${{ env.MUSE_SERVICE }}" "${BASE_ARGS[@]}"
          echo "url=$(gcloud run services describe "${{ env.MUSE_SERVICE }}" --region "${{ env.REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Verify live MCP and real browser mission
        env:
          MCP_URL: ${{ steps.muse.outputs.url }}/mcp
          MCP_BEARER_TOKEN: ${{ secrets.MUSE_MCP_BEARER_TOKEN }}
        run: npm run verify:live
      - name: Show service URLs
        run: |
          echo "Muse MCP: ${{ steps.muse.outputs.url }}/mcp"
          echo "Browser worker: ${{ steps.browser.outputs.url }}"
