name: Bootstrap lockfile

on:
  push:
    branches:
      - fix/operational-checkpoint
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/operational-checkpoint

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and dispatch CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the branch"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:fix/operational-checkpoint

          gh workflow run ci.yml --repo "${{ github.repository }}" --ref fix/operational-checkpoint
