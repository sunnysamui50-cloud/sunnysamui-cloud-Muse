name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Reproducibility gate
        run: test -f package-lock.json

      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Main container build
        run: docker build --tag muse-mcp:test .
      - name: Main container startup smoke
        run: |
          docker run --detach --name muse-mcp-smoke --publish 18080:8080 \
            --env PORT=8080 \
            --env MCP_BEARER_TOKEN=ci-startup-token-abcdefghijklmnopqrstuvwxyz-123456 \
            --env BROWSER_WORKER_URL=https://example.com \
            --env BROWSER_WORKER_AUTH_MODE=iam \
            muse-mcp:test
          trap 'docker logs muse-mcp-smoke || true; docker rm -f muse-mcp-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs muse-mcp-smoke
          exit 1

      - name: Browser worker container build
        run: docker build --file Dockerfile.browser --tag muse-browser-worker:test .
      - name: Real browser TDD
        run: |
          docker run --rm --network host             -e MUSE_LIVE_BROWSER_E2E=1 \
            -e MUSE_BROWSER_TEST=1             -v "$PWD:/app" -w /app             mcr.microsoft.com/playwright:v1.63.0-noble             node --import tsx --test test/browser-*.test.ts
