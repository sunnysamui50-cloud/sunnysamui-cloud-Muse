name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Reproducibility gate
        run: test -f package-lock.json || echo "::warning::package-lock.json is required before production release"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Main container build
        run: docker build --tag muse-mcp:test .
      - name: Browser worker container build
        run: docker build --file Dockerfile.browser --tag muse-browser-worker:test .
