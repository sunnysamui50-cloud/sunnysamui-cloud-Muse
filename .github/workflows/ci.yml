name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap lockfile on trusted checkpoint branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/operational-checkpoint' && hashFiles('package-lock.json') == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:fix/operational-checkpoint
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Emit generated lockfile for checkpoint capture
        if: ${{ github.event_name == 'pull_request' && hashFiles('package-lock.json') == '' }}
        run: |
          npm install --package-lock-only --ignore-scripts
          echo "MUSE_LOCKFILE_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "MUSE_LOCKFILE_END"
      - name: Reproducibility gate
        run: test -f package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Main container build
        run: docker build --tag muse-mcp:test .
      - name: Browser worker container build
        run: docker build --file Dockerfile.browser --tag muse-browser-worker:test .
      - name: Real browser TDD
        run: |
          docker run --rm --network host             -e MUSE_LIVE_BROWSER_E2E=1 \
            -e MUSE_BROWSER_TEST=1             -v "$PWD:/app" -w /app             mcr.microsoft.com/playwright:v1.63.0-noble             node --import tsx --test test/browser-*.test.ts
